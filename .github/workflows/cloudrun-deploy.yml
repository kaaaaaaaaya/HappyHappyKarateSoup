name: cloud run deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target environment"
        required: true
        type: choice
        options:
          - staging
          - prod
        default: staging
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "infra/cloudrun/**"
      - ".github/workflows/cloudrun-deploy.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-deploy-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to cloud run
    if: ${{ github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}

    env:
      REGION: us-central1
      REPO: happy-soup
      BACKEND_SERVICE: karate-soup-api
      WEB_SERVICE: karate-soup-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          CLOUDSQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          APP_GCS_BUCKET_NAME: ${{ secrets.APP_GCS_BUCKET_NAME }}
          APP_GCS_OBJECT_PREFIX: ${{ secrets.APP_GCS_OBJECT_PREFIX }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for k in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT_EMAIL \
            CLOUDSQL_INSTANCE_CONNECTION_NAME \
            SPRING_DATASOURCE_URL \
            SPRING_DATASOURCE_USERNAME \
            SPRING_DATASOURCE_PASSWORD \
            APP_GCS_BUCKET_NAME \
            APP_GCS_OBJECT_PREFIX \
            APP_CORS_ALLOWED_ORIGINS \
            VITE_GOOGLE_CLIENT_ID
          do
            if [ -z "${!k:-}" ]; then
              echo "[ERROR] Missing secret: $k" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "[HINT] Secrets are not available for workflows triggered from forks/Dependabot. Run from the default branch (main) and configure repo/environment secrets." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set image tags
        id: vars
        run: |
          echo "backend_image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/backend" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/web/backend-java
          push: true
          tags: |
            ${{ steps.vars.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.backend_image }}:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "${{ env.BACKEND_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --image "${{ steps.vars.outputs.backend_image }}:${{ github.sha }}" \
            --add-cloudsql-instances "${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" \
            --set-env-vars "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" \
            --set-env-vars "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
            --set-env-vars "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
            --set-env-vars "GEMINI_USE_VERTEX_AI=true" \
            --set-env-vars "GEMINI_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "GEMINI_LOCATION=${{ env.REGION }}" \
            --set-env-vars "GEMINI_TEXT_MODEL=gemini-2.5-flash" \
            --set-env-vars "GEMINI_IMAGE_MODEL=gemini-2.5-flash-image" \
            --set-env-vars "SOUP_LOCAL_FALLBACK_ENABLED=false" \
            --set-env-vars "APP_GCS_BUCKET_NAME=${{ secrets.APP_GCS_BUCKET_NAME }}" \
            --set-env-vars "APP_GCS_OBJECT_PREFIX=${{ secrets.APP_GCS_OBJECT_PREFIX }}" \
            --set-env-vars "APP_CORS_ALLOWED_ORIGINS=${{ secrets.APP_CORS_ALLOWED_ORIGINS }}"

      - name: Resolve backend URL
        id: backend-url
        run: |
          url="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" --project "${{ secrets.GCP_PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          if [ -z "$url" ]; then
            echo "[ERROR] Failed to resolve backend URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "[INFO] backend_url=$url"
          {
            echo "## Deploy Outputs"
            echo ""
            echo "- Backend: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.backend-url.outputs.url }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.vars.outputs.web_image }}:${{ github.sha }}
            ${{ steps.vars.outputs.web_image }}:latest

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy "${{ env.WEB_SERVICE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --image "${{ steps.vars.outputs.web_image }}:${{ github.sha }}" \
            --port 80

      - name: Resolve web URL
        id: web-url
        run: |
          url="$(gcloud run services describe "${{ env.WEB_SERVICE }}" --project "${{ secrets.GCP_PROJECT_ID }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          if [ -z "$url" ]; then
            echo "[ERROR] Failed to resolve web URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "[INFO] web_url=$url"
          echo "- Web: $url" >> "$GITHUB_STEP_SUMMARY"
